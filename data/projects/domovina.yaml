summary:
  en: >-
    AI-native Croatian media platform of 30+ public repositories, built
    end-to-end by one engineer. An automated pipeline (Whisper.cpp on Metal,
    NVIDIA Canary on Colab GPUs, pyannote diarization, Gemini via multi-region
    Vertex AI) has processed 3,034 podcast episodes across 46 channels into
    137,451 semantic RAG chunks, searchable through a public MCP server and a
    Flutter app that ships to web (WASM), iOS, Android and Android TV.
  hr: >-
    AI-native hrvatska medijska platforma od 30+ javnih repozitorija,
    izgrađena end-to-end od jednog inženjera. Automatizirani pipeline
    (Whisper.cpp na Metalu, NVIDIA Canary na Colab GPU-ima, pyannote
    dijarizacija, Gemini kroz multi-region Vertex AI) obradio je 3.034
    epizode podcasta u 46 kanala u 137.451 semantički RAG chunk, pretraživih
    kroz javni MCP server i Flutter aplikaciju za web (WASM), iOS, Android i
    Android TV.
highlights:
  - en: >-
      RAG search with bge-m3 embeddings in ClickHouse (HNSW, ~10–50 ms) +
      PostgreSQL metadata; production MCP server with OAuth, rate limiting
      and an audit dashboard
    hr: >-
      RAG pretraga s bge-m3 embeddinzima u ClickHouseu (HNSW, ~10–50 ms) +
      PostgreSQL metapodaci; produkcijski MCP server s OAuthom, rate
      limitingom i audit dashboardom
  - en: >-
      pay.domovina.ai — three payment formats from one form (SEPA EPC QR,
      Croatian HUB3 PDF417, EIP-681) with Safe 2/3 multisig routing of
      Monerium EURe on Gnosis Chain
    hr: >-
      pay.domovina.ai — tri formata plaćanja iz jedne forme (SEPA EPC QR,
      hrvatski HUB3 PDF417, EIP-681) sa Safe 2/3 multisig usmjeravanjem
      Monerium EURe na Gnosis Chainu
  - en: >-
      klubovi.domovina.ai — open catalogue of 901 Croatian football clubs,
      100% geocoded, ingested from 6+ sources (incl. TLS-fingerprint-aware
      scraping) with AI-audited 89–93/100 accuracy
    hr: >-
      klubovi.domovina.ai — otvoreni katalog 901 hrvatskog nogometnog kluba,
      100% geokodiran, prikupljen iz 6+ izvora (uklj. scraping svjestan TLS
      fingerprinta) s AI-auditiranom točnošću 89–93/100
  - en: >-
      Subscriptions with RevenueCat as the single billing system of record
      across iOS, macOS, Android, Android TV and the web (Web Billing) — one
      entitlement, a webhook mirroring state into Supabase Postgres behind RLS
      as the cross-platform source of truth, optimistic unlock on mobile
    hr: >-
      Pretplate s RevenueCatom kao jedinstvenim sustavom naplate na iOS-u,
      macOS-u, Androidu, Android TV-u i webu (Web Billing) — jedan entitlement,
      webhook koji stanje zrcali u Supabase Postgres iza RLS-a kao
      cross-platform izvor istine, optimistično otključavanje na mobitelu
  - en: >-
      Self-hosted Supabase SSO (passkeys + Croatian eID via flutter_certilia)
      behind Cloudflare Tunnel on Coolify; self-hosted SMS gateway with an
      Android device as the sender
    hr: >-
      Self-hosted Supabase SSO (passkeys + hrvatski eID kroz flutter_certilia)
      iza Cloudflare Tunnela na Coolifyju; self-hosted SMS gateway s Android
      uređajem kao pošiljateljem

summary:
  en: >-
    Classifies Croatian legal entities by tax number into micro, small, medium
    or large under the Accounting Act, and tracks legal status (active, struck
    off, in liquidation, bankrupt, blocked). Reads the official size marker
    straight from the public FINA business registry with a plain fetch, falling
    back to scraped sources only for what that registry does not cover.
  hr: >-
    Razvrstava hrvatske pravne osobe po OIB-u na mikro, male, srednje i velike
    prema Zakonu o računovodstvu i prati pravni status (aktivan, brisan, u
    likvidaciji, u stečaju, blokada). Službenu oznaku veličine čita izravno iz
    javnog FINA registra običnim fetchom, a na scrapeane izvore se oslanja samo
    za ono što taj registar ne pokriva.
highlights:
  - en: >-
      The Worker never scrapes — all heavy enrichment runs locally and pushes
      results in, keeping the edge API cheap, fast and free of third-party
      rate limits
    hr: >-
      Worker nikad ne scrapea — svo teško obogaćivanje trči lokalno i rezultate
      gura unutra, pa edge API ostaje jeftin, brz i neovisan o tuđim rate
      limitima
tags: [opendata, croatia, cloudflare, data, typescript]
